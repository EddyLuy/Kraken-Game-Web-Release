<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/Kraken-Game-Web-Release/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sail, fight, fish, and explore in Kraken Game.">
  <meta name="theme-color" content="#061B35">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kraken Game">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kraken Game</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #061b2a;
    }

    #kraken-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: grid;
      place-items: center;
      color: #f7dfa0;
      background:
        radial-gradient(circle at 50% 34%, #124f69 0, #082b3d 34%, #061b2a 72%);
      font-family: Georgia, "Times New Roman", serif;
      transition: opacity 220ms ease;
    }

    #kraken-loader.kraken-loader--done {
      opacity: 0;
      pointer-events: none;
    }

    .kraken-loader__panel {
      width: min(82vw, 460px);
      text-align: center;
    }

    .kraken-loader__mark {
      font-size: 64px;
      line-height: 1;
      filter: drop-shadow(0 5px 12px rgba(0, 0, 0, .45));
    }

    .kraken-loader__title {
      margin: 14px 0 20px;
      font-size: clamp(28px, 6vw, 44px);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .kraken-loader__track {
      height: 8px;
      overflow: hidden;
      border: 1px solid rgba(247, 223, 160, .7);
      border-radius: 999px;
      background: rgba(0, 0, 0, .28);
    }

    .kraken-loader__bar {
      width: 28%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #d99a2b, #fff0ae, #d99a2b);
      animation: kraken-loading 1.15s ease-in-out infinite;
    }

    .kraken-loader__status {
      min-height: 24px;
      margin-top: 15px;
      font-family: system-ui, sans-serif;
      font-size: 15px;
      color: #fff4d5;
    }

    .kraken-loader__elapsed {
      margin-top: 6px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      color: rgba(255, 244, 213, .7);
    }

    @keyframes kraken-loading {
      from { transform: translateX(-110%); }
      to { transform: translateX(370%); }
    }
  </style>
</head>
<body>
  <div id="kraken-loader" role="status" aria-live="polite">
    <div class="kraken-loader__panel">
      <div class="kraken-loader__mark" aria-hidden="true">⚓</div>
      <div class="kraken-loader__title">Kraken Game</div>
      <div class="kraken-loader__track" aria-hidden="true">
        <div class="kraken-loader__bar"></div>
      </div>
      <div id="kraken-loader-status" class="kraken-loader__status">
        Downloading game code…
      </div>
      <div id="kraken-loader-elapsed" class="kraken-loader__elapsed">
        0.0 seconds
      </div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
